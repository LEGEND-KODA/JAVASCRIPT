<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Area and BMI Calculator Assignment</h1>

    <!-- Triangle -->
    <h2>Area of a Triangle</h2>
    <input type="number" id="triangleBase" placeholder="Enter base">
    <input type="number" id="triangleHeight" placeholder="Enter height">
    <button onclick="triangle()">Calculate</button>

    <!-- Square -->
    <h2>Area of a Square</h2>
    <input type="number" id="squareSide" placeholder="Enter side">
    <button onclick="square()">Calculate</button>

    <!-- Circle -->
    <h2>Area of a Circle</h2>
    <input type="number" id="circleRadius" placeholder="Enter radius">
    <button onclick="circle()">Calculate</button>

    <!-- Quadrilateral -->
    <h2>Area of a Quadrilateral</h2>
    <input type="number" id="quadLength" placeholder="Enter length">
    <input type="number" id="quadWidth" placeholder="Enter width">
    <button onclick="quadrilateral()">Calculate</button>

    <!-- Rhombus -->
    <h2>Area of a Rhombus</h2>
    <input type="number" id="diagonal1" placeholder="Enter diagonal 1">
    <input type="number" id="diagonal2" placeholder="Enter diagonal 2">
    <button onclick="rhombus()">Calculate</button>

    <!-- Trapezium -->
    <h2>Area of a Trapezium</h2>
    <input type="number" id="trapA" placeholder="Enter parallel side A">
    <input type="number" id="trapB" placeholder="Enter parallel side B">
    <input type="number" id="trapHeight" placeholder="Enter height">
    <button onclick="trapezium()">Calculate</button>

    <!-- Parallelogram -->
    <h2>Area of a Parallelogram</h2>
    <input type="number" id="paraBase" placeholder="Enter base">
    <input type="number" id="paraHeight" placeholder="Enter height">
    <button onclick="parallelogram()">Calculate</button>

    <!-- BMI -->
    <h2>Body Mass Index (BMI)</h2>
    <input type="number" id="weight" placeholder="Weight in kg">
    <input type="number" id="height" placeholder="Height in metres">
    <button onclick="bmi()">Calculate</button>


    <script src="script.js"></script>

</body>
</html>
